<div class="form-container sign-up">
    <form (ngSubmit)="onSubmit()">
      <h1>Create Account</h1>
      <input type="text" [(ngModel)]="user.fullname" name="fullname" placeholder="Full Name" required>
      <input type="text" [(ngModel)]="user.CIN" name="CIN" placeholder="CIN" required>
      <input type="email" [(ngModel)]="user.email" name="email" placeholder="Email" required>
      <input type="tel" [(ngModel)]="user.number" name="number" placeholder="Number" pattern="[0-9]{8}" required>
      <input type="password" [(ngModel)]="user.password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
      <div class="message">{{ message }}</div>
    </form>
  </div>
